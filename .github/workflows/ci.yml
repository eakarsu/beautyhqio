name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: beautyhq_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/beautyhq_test
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-only-random-looking-secret-value-0000000000000000
      CORS_ORIGINS: http://localhost:3000
      CRON_SECRET: ci-only-cron-secret-value-0000000000000000000
      RUN_DATABASE_INTEGRATION: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run seed:governed
        env:
          ALLOW_E2E_SEED: "true"
          DEMO_PASSWORD: "E2E-Only-Passphrase-2026!"
      - run: npm run test:governed
      - run: npm run audit:prod
